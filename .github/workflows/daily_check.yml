name: Daily Proxy Check

on:
  schedule:
    - cron: '0 19 * * *'  # JST 4:00（UTC 19:00）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-proxies:
    runs-on: ubuntu-24.04

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Pythonのセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 依存ライブラリのインストール
        run: python -m pip install "requests[socks]"

      - name: プロキシチェック実行
        run: python main.py

      - name: 結果をコミット＆プッシュ
        run: |
          git config user.name "ProxyBot"
          git config user.email "bot@example.com"

          git add alive_http.txt alive_socks4.txt alive_socks5.txt list_cache.txt

          # 変更がなければ正常終了
          if git diff --cached --quiet; then
            echo "変更はありません"
            exit 0
          fi

          git commit -m "Update proxy lists [skip ci]"
          git push
